パスコストを元に戻してブロッキングポートを元に戻す


SW2(config)#int ethernet0/2
SW2(config-if)#
SW2(config-if)#spanning-tree vlan 10 cost 100
SW2(config-if)#do wr me
Building configuration...
[OK]
SW2(config-if)#
SW2(config-if)#exit
SW2(config)#
SW2(config)#exit
SW2#
