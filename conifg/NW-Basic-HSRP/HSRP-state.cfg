HSRPのpreempt設定をして、切り戻しした時にR1がプライマリーになるようにする！

R1(config)#int ethernet0/2
R1(config-if)#
R1(config-if)#
R1(config-if)#standby 10 preempt
R1(config-if)#
*May  9 07:11:28.080: %HSRP-5-STATECHANGE: Ethernet0/2 Grp 10 state Standby -> Active
R1(config-if)#


Activeになった！！

　
